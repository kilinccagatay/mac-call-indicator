# Merge this item into your existing template: list. Do not replace other items.
# Generate a private random ID and define mac_call_indicator_webhook in secrets.yaml.
template:
  - triggers:
      - trigger: webhook
        webhook_id: !secret mac_call_indicator_webhook
        allowed_methods: [POST]
        local_only: true
        id: report
      - trigger: homeassistant
        event: start
        id: startup
      - trigger: time_pattern
        seconds: "/5"
        id: watchdog
    binary_sensor:
      - name: Mac Call Active
        unique_id: mac_call_indicator_active
        state: >-
          {% set valid = trigger.id == 'report' and trigger.json is defined and
             trigger.json is mapping and trigger.json.in_call is defined and
             (trigger.json.in_call is sameas true or trigger.json.in_call is sameas false) %}
          {{ trigger.json.in_call if valid else this.state == 'on' }}
        availability: >-
          {% set valid = trigger.id == 'report' and trigger.json is defined and
             trigger.json is mapping and trigger.json.in_call is defined and
             (trigger.json.in_call is sameas true or trigger.json.in_call is sameas false) %}
          {% set age = as_timestamp(now()) - (this.attributes.last_report_epoch | default(0) | float(0)) %}
          {{ trigger.id != 'startup' and (valid or (age >= -5 and age < 40)) }}
        attributes:
          last_report_epoch: >-
            {% set valid = trigger.id == 'report' and trigger.json is defined and
               trigger.json is mapping and trigger.json.in_call is defined and
               (trigger.json.in_call is sameas true or trigger.json.in_call is sameas false) %}
            {{ as_timestamp(now()) if valid else
               (0 if trigger.id == 'startup' else this.attributes.last_report_epoch | default(0)) }}
