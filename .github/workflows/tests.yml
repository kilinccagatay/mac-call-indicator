name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: swift test
  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tests_ha/requirements.txt
      - run: python -m pip install -r tests_ha/requirements.txt
      - run: python -m pytest tests_ha -q
